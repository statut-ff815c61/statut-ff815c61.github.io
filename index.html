<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Statut</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%233fb950%22/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6eb; --text: #15191f; --muted: #667085;
      --ok: #1f9d4c; --live: #d64545; --warn: #c98a14; --down: #d64545; --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1216; --surface: #171b21; --border: #2a313b; --text: #e6e9ee; --muted: #8b95a3;
              --ok: #3fb950; --live: #ef5a5a; --warn: #e0a030; --down: #ef5a5a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 40px; display: grid; gap: 18px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
    h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .status { display: flex; align-items: flex-start; gap: 16px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--muted); }
    .ok .dot { background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 18%, transparent); }
    .live .dot { background: var(--live); animation: pulse 1.8s ease-in-out infinite; }
    .maintenance .dot { background: var(--warn); }
    .panne .dot, .silence .dot { background: var(--down); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--live) 22%, transparent); } }
    .headline { font-size: 22px; font-weight: 650; margin: 0; }
    .detail { color: var(--muted); margin: 4px 0 0; }
    .meta { font-size: 13px; color: var(--muted); margin: 0; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; }
    @media (max-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } .t { font-size: 13px; } }
    .item { min-width: 0; }
    .poster { aspect-ratio: 2 / 3; border-radius: 8px; background: var(--border); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .t { font-size: 14px; font-weight: 600; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--muted); margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Statut</h1>
    <section class="card status" id="status">
      <span class="dot"></span>
      <div>
        <p class="headline" id="headline">Chargement…</p>
        <p class="detail" id="detail"></p>
      </div>
    </section>
    <section class="card" id="recent-card" hidden>
      <h2>Ajouté récemment</h2>
      <div class="grid" id="recent"></div>
    </section>
    <p class="meta" id="meta"></p>
  </main>
  <script>
    const MSG = {
      ok: ["Tout fonctionne", "Plex est disponible."],
      live: ["Live en cours", "La lecture à distance est en pause le temps du live. Elle revient juste après."],
      maintenance: ["Maintenance", "Mises à jour en cours, retour dans peu de temps."],
      panne: ["Plex indisponible", "Indisponible pour le moment, retour dès que possible."],
      silence: ["Statut inconnu", "Pas de nouvelles du serveur depuis un moment."],
    };
    const $ = (id) => document.getElementById(id);
    function ago(date) {
      const m = Math.round((Date.now() - date.getTime()) / 60000);
      if (m < 1) return "à l'instant";
      if (m < 60) return `il y a ${m} min`;
      const h = Math.floor(m / 60);
      return h < 48 ? `il y a ${h} h` : `il y a ${Math.floor(h / 24)} jours`;
    }
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
    async function load() {
      let s;
      try {
        const r = await fetch(`statut.json?t=${Date.now()}`, { cache: "no-store" });
        s = await r.json();
      } catch { $("meta").textContent = "Impossible de lire le statut pour l'instant."; return; }
      const updated = new Date(s.maj);
      const stale = Date.now() - updated.getTime() > 2.5 * 3600 * 1000;   // le serveur publie au moins une fois par heure
      const state = stale ? "silence" : s.etat;
      $("status").className = `card status ${state}`;
      [$("headline").textContent, $("detail").textContent] = MSG[state] || MSG.silence;
      document.title = `Statut — ${MSG[state][0]}`;
      $("meta").textContent = `Mis à jour ${ago(updated)}`;
      const grid = $("recent");
      grid.replaceChildren();
      $("recent-card").hidden = !(s.recents && s.recents.length);
      for (const r of s.recents || []) {
        const item = el("div", "item");
        const p = el("div", "poster");
        if (r.affiche) { const img = new Image(); img.src = r.affiche; img.alt = ""; img.loading = "lazy"; p.append(img); }
        else p.textContent = r.type;
        item.append(p, el("div", "t", r.titre), el("div", "s", r.detail || r.type));
        item.title = `${r.titre}${r.detail ? " — " + r.detail : ""}`;
        grid.append(item);
      }
    }
    load();
    setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
